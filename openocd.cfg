adapter driver remote_bitbang
transport select jtag
remote_bitbang host /tmp/jtag.sock
reset_config none

jtag newtap auto0 tap -irlen 4 -expected-id 0x5ba00477
jtag newtap auto1 tap -irlen 11 -expected-id 0x001c80e1

# DAP. -ignore-syspwrupack: this SoC asserts CDBGPWRUPACK but never
# CSYSPWRUPACK; the flag lets dap init complete. (Despite CSYSPWRUPACK staying
# low, the AXI-AP system bus reads/writes fine.)
dap create auto0.dap -chain-position auto0.tap -ignore-syspwrupack

# AP map discovered 2026-06-23:
#   AP0 0x14770004  AXI-AP   -> system bus, MMIO read/write works
#   AP1 0x44770002  APB-AP   -> A53 APSS CoreSight debug (BASE 0x80000000)
#   AP3 0x24770011  AHB-AP   -> RPM Cortex-M3 debug (ROM @0xe00ff000, OPEN)
# The A53 application cores are behind the APB-AP. Target them there, NOT the
# AXI-AP that the old config used.
#
# dbgbase + CTI found 2026-06-24 (per QCS6490 openocd patch, same APSS layout:
# https://sourceforge.net/p/openocd/mailman/message/59116199/). The APB-AP
# (BASE 0x80000000) ROM-table autodiscovery faults, but the core0 debug block is
# directly readable at 0x87010000, with its CTI at 0x87020000. Confirmed core0:
# MIDR=0x410fd034 (Cortex-A53 r0p4), EDDEVARCH=0x47706a15 (ARMv8-A debug),
# EDPRSR.PU=1 (debug powered), EDSCR live. The "CSYSPWRUPACK/core off" verdict
# was a wrong-address artifact. aarch64 halt needs the CTI object below.
# Per-core layout (mapped 2026-06-24 via DEVTYPE scan with `poll off`; all four
# confirmed MIDR=0x410fd034, debug DEVTYPE=0x15, CTI DEVTYPE=0x14):
#   stride 0x100000 per core; CTI at debug + 0x10000. Each core's 0x40000 block
#   holds debug(+0)/CTI(+0x10000)/PMU(+0x20000)/ETM(+0x30000).
#   core0 dbg 0x87010000 cti 0x87020000
#   core1 dbg 0x87110000 cti 0x87120000
#   core2 dbg 0x87210000 cti 0x87220000
#   core3 dbg 0x87310000 cti 0x87320000
# Idle cores power-collapse their debug; pin a spinner per core to examine them.
cti create auto0.cti0 -dap auto0.dap -ap-num 1 -baseaddr 0x87020000
cti create auto0.cti1 -dap auto0.dap -ap-num 1 -baseaddr 0x87120000
cti create auto0.cti2 -dap auto0.dap -ap-num 1 -baseaddr 0x87220000
cti create auto0.cti3 -dap auto0.dap -ap-num 1 -baseaddr 0x87320000
# Each core gets its own gdb port (3333..3336) so gdb can attach to ANY core
# directly. The SMP group below presents all cores as gdb "threads" on a single
# port, but that fails ("SMP register sp is 32 bits on one target, but 64 bits
# on another") whenever cores 2/3 are in reset and read back as AArch32 -- the
# merged target-description can't reconcile 32- vs 64-bit SP, so gdb sees only
# core0. Per-core ports sidestep the merge: attach core1 at :3334, etc.
target create auto0.a53.0 aarch64 -dap auto0.dap -ap-num 1 -coreid 0 \
	-dbgbase 0x87010000 -cti auto0.cti0 -gdb-port 3333
target create auto0.a53.1 aarch64 -dap auto0.dap -ap-num 1 -coreid 1 \
	-dbgbase 0x87110000 -cti auto0.cti1 -gdb-port 3334
target create auto0.a53.2 aarch64 -dap auto0.dap -ap-num 1 -coreid 2 \
	-dbgbase 0x87210000 -cti auto0.cti2 -gdb-port 3335
target create auto0.a53.3 aarch64 -dap auto0.dap -ap-num 1 -coreid 3 \
	-dbgbase 0x87310000 -cti auto0.cti3 -gdb-port 3336

# SMP grouping is DISABLED: an SMP group serves all cores through one gdb port
# (3333) as threads, and that merge fails when cores 2/3 are in reset/AArch32
# ("SMP register sp is 32 bits ... 64 bits"), leaving only core0 reachable.
# Without the group, each per-core -gdb-port above opens independently, so gdb
# can attach to any single core: e.g. `target extended-remote :3334` -> core1.
# halt/resume then act per-core (use halt-cores.sh to halt the whole cluster).
# To restore cluster-wide gdb stepping for the PSCI/kexec pivot, re-add:
#target smp auto0.a53.0 auto0.a53.1 auto0.a53.2 auto0.a53.3

# AXI-AP (AP0, IDR 0x14770004): raw system-bus access, non-cacheable. Use for
# the cached-VA (core) vs uncached-bus (here) stale-memory diff. mem_ap gives
# mdw/mdd without a core: `auto0.axi mdw <pa>`.
target create auto0.axi mem_ap -dap auto0.dap -ap-num 0

gdb breakpoint_override hard
