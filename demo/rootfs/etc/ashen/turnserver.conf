# coturn for Galene (ashen-turn.service): plain TURN on 3478/udp+tcp, shared-secret auth.
# Relays are allocated on the address the client used, i.e. the board's LAN address.
listening-port=3478
realm=ashen-demo
use-auth-secret
fingerprint
no-tls
no-dtls
no-cli
no-multicast-peers
min-port=49152
max-port=65535
log-file=stdout
simple-log
